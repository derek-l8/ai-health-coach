[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-health-coach"
version = "0.1.0"
description = "Synthetic-data and evaluation foundation for a personal health modeling study"
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
dependencies = ["tzdata>=2025.2; sys_platform == 'win32'"]

[project.scripts]
ai-health-coach = "ai_health_coach.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
