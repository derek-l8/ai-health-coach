<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic reconstructed Coach insight screenshot</title>
  <desc id="desc">A fictional later answer about an earlier day, clearly marked as reconstructed.</desc>
  <rect width="390" height="844" fill="#f6f4fa"/>
  <rect x="18" y="20" width="354" height="54" rx="18" fill="#352657"/>
  <text x="40" y="54" font-family="system-ui,sans-serif" font-size="18" fill="white">Coach history</text>
  <rect x="18" y="98" width="354" height="320" rx="24" fill="white" stroke="#d6cde8"/>
  <text x="42" y="136" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6745a1">RECONSTRUCTED · SYNTHETIC</text>
  <text x="42" y="176" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#211a2d">Earlier low-energy day</text>
  <text x="42" y="214" font-family="system-ui,sans-serif" font-size="16" fill="#524a60">This fictional answer was generated</text>
  <text x="42" y="238" font-family="system-ui,sans-serif" font-size="16" fill="#524a60">later. It must not be treated as the</text>
  <text x="42" y="262" font-family="system-ui,sans-serif" font-size="16" fill="#524a60">message available on the original day.</text>
  <rect x="42" y="304" width="226" height="54" rx="14" fill="#eee9f7"/>
  <text x="58" y="326" font-family="system-ui,sans-serif" font-size="13" fill="#4e3b70">Available: Jan 10, 10:30</text>
  <text x="58" y="346" font-family="system-ui,sans-serif" font-size="13" fill="#4e3b70">Discussed interval: Jan 6–7</text>
  <text x="195" y="740" text-anchor="middle" transform="rotate(-28 195 740)" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#6745a1" opacity="0.15">SYNTHETIC</text>
  <text x="195" y="812" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#635b70">No real account, person, or provider message</text>
</svg>
